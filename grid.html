
<!DOCTYPE html>


<html>

<head>
    <title>grid</title>
    <style>
        .columns {
            display: grid;
            grid-template: 1fr 1fr 1fr;
        }
        .container{
            grid-template-rows:100px 100px;
        }
        .container{
            gap:20px;
        }
        .item{
            grid-area:1 / 1 / 3 / 3 ;
        }
    </style>
</head>

<body>
