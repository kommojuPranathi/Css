<!DOCTYPE html>
<html>

<head>
    <title>display</title>
    <style>
        .display{
            display:block;
            background:lightblue;
        }
        .span{
            display:inline;
            background:lightblue;
        }
        .box{
            display:inline-block;
            background:lightblue;
            width: 100px;
            height: 100px;
        }
        .hide{
            display:none;
        }
    </style>
</head>
<body>
    <h1>displayblock</h1>
    <div class="display">
        <p>explanation</p>
        <p>block takes full width and starts on new line</p>
    </div>
        <h2>inline</h2>
        <div class="span">
            <p>explanation</p>
            <p> text appeares side by side</p>
        </div>
        <h3>inline-block</h3>
        <div class="box">
            <p>explanation</p>
            <p>boxes appear side by side</p>
        </div>
        <h1>none</h1>
        <div class="hide">
            <p>expalanation</p>
            <p>hidden element will not appear</p>
        </div>
    
</body>
</html>
